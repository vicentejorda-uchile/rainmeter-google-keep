[Rainmeter]
Update=1000
AccurateText=1

[Variables]
; Cambia estos valores a tu gusto
Titulo=Mi lista
Ancho=300
Alto=360
Fuente=Segoe UI
ColorTexto=255,255,255,235
ColorFondo=20,20,20,170

; Lee nota.txt (la que genera keep_sync.py) cada 30 segundos
[mNota]
Measure=WebParser
URL=file://#@#nota.txt
RegExp=(?s)^(.*)$
StringIndex=1
CodePage=65001
UpdateRate=30

[Fondo]
Meter=Shape
Shape=Rectangle 0,0,#Ancho#,#Alto#,12 | Fill Color #ColorFondo# | StrokeWidth 0

[Cabecera]
Meter=String
X=16
Y=12
FontFace=#Fuente#
FontSize=14
FontWeight=700
FontColor=#ColorTexto#
AntiAlias=1
Text=#Titulo#

[Contenido]
Meter=String
MeasureName=mNota
X=16
Y=46
W=(#Ancho#-32)
H=(#Alto#-58)
ClipString=1
FontFace=#Fuente#
FontSize=11
FontColor=#ColorTexto#
AntiAlias=1
